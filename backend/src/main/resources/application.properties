spring.application.name=backend

# ===== Database Configuration =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jewelry_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.defer-datasource-initialization=${SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION:true}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

# ===== Server Configuration =====
server.port=${SERVER_PORT:8080}

# ===== VNPay Configuration =====
vnpay.payUrl=${VNPAY_PAYURL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURNURL:https://localhost:3000/payment-return}
vnpay.tmnCode=${VNPAY_TMNCODE:FO3DOM8U}
vnpay.hashSecret=${VNPAY_HASHSECRET:2CHGHRKJZBG2CE0AZKJBT0663TV9V718}

# ===== CORS Configuration =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
